name: build

# The first half of releasing a usr.games program, called on a tag v*. It runs the repository's
# checks, builds the release and lists its files in a manifest, unsigned, as the run's artifact
# release. publish.yml, the second half, signs it and publishes it: in the same run, or, for a
# program whose source is private, in the public release repository it is handed over to.
# RELEASES.md says how to call both.
#
# Every step is written in these two files, so the commit a caller pins is the whole of what runs.
on:
  workflow_call:
    inputs:
      name:
        description: "The program's name: its file inside each archive, and the start of each archive's name."
        type: string
        required: true
      package:
        description: "The Go package that is the program."
        type: string
        default: "."
      dir:
        description: "The folder of the Go module, when it is not the repository's root."
        type: string
        default: "."
      go-version:
        type: string
        default: "1.27"
      page:
        description: "Also build the program for a web page."
        type: boolean
        default: false
      man:
        description: "A manual page, such as man/rustwake.6: it goes in each archive, and is shipped as HTML too. Empty for none."
        type: string
        default: ""
      media:
        description: "A make target that writes the program's recording, NAME.gif and NAME.png, into the folder MEDIA names. Empty for none."
        type: string
        default: ""
      rehearsal:
        description: "Version the release v0.0.0-rehearsal, build it twice to check the two are the same, and hand nothing over."
        type: boolean
        default: false
      to:
        description: "For a program whose source is private: the public release repository, such as usrgames/rustwake.6, that the release is handed over to, to be signed and published there. Empty: the release stays in this run."
        type: string
        default: ""
    secrets:
      HANDOVER_TOKEN:
        description: "With to: a token that may write the release repository's contents and start its workflows."
        required: false

permissions:
  contents: read

env:
  # Never download a different Go than the one the job asked for.
  GOTOOLCHAIN: local
  NAME: ${{ inputs.name }}
  VERSION: ${{ inputs.rehearsal && 'v0.0.0-rehearsal' || github.ref_name }}

jobs:
  # The archives, the build for a page, the manual page, the recording, and the manifest that
  # lists them all.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - name: only a tag v* is released
        if: ${{ !inputs.rehearsal && !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: .
        run: |
          echo "this ran on $GITHUB_REF: a release is made from a tag v*, and anything else is a rehearsal" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          # A release is built from nothing but the tag: no cache from an earlier run.
          cache: false
      - run: make check
      # Made before the checkout is checked, so a target that writes into it is caught there.
      - name: the recording
        if: ${{ inputs.media != '' }}
        env:
          MEDIA_TARGET: ${{ inputs.media }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -u
          # What the site shows on the game's page: NAME.gif, playing over and over, and NAME.png,
          # its still. Made outside the checkout, then held to what the site takes.
          record() { # $1 = the folder to make it in
            local dir="$1" got size
            mkdir -p "$dir"
            make "$MEDIA_TARGET" MEDIA="$dir"
            got=$(cd "$dir" && ls -A | LC_ALL=C sort | tr '\n' ' ')
            if [ "$got" != "$NAME.gif $NAME.png " ]; then
              echo "make $MEDIA_TARGET must write $NAME.gif and $NAME.png and nothing else, and wrote: $got" >&2
              return 1
            fi
            for f in "$dir/$NAME.gif" "$dir/$NAME.png"; do
              if [ ! -f "$f" ] || [ -L "$f" ] || [ ! -s "$f" ]; then echo "$(basename "$f") is not a file with something in it" >&2; return 1; fi
            done
            if [ "$(head -c 6 "$dir/$NAME.gif")" != GIF89a ]; then echo "$NAME.gif is not a GIF" >&2; return 1; fi
            if [ "$(head -c 8 "$dir/$NAME.png" | od -An -tx1 | tr -d ' \n')" != 89504e470d0a1a0a ]; then echo "$NAME.png is not a PNG" >&2; return 1; fi
            # The site's front page loads one for each game.
            size=$(wc -c < "$dir/$NAME.gif" | tr -d ' ')
            if [ "$size" -gt 3000000 ]; then echo "$NAME.gif is $size bytes: over the 3,000,000 the site allows" >&2; return 1; fi
            echo "the recording: $NAME.gif, $size bytes, and $NAME.png"
          }
          record "$RUNNER_TEMP/media"
          if [ "$REHEARSAL" = true ]; then
            record "$RUNNER_TEMP/media-twice"
            diff -r "$RUNNER_TEMP/media" "$RUNNER_TEMP/media-twice" > /dev/null || { echo "made twice, the recording differs" >&2; exit 1; }
            echo "made twice, the recording is the same"
          fi
      - name: the tool that turns a manual page into HTML
        if: ${{ inputs.man != '' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mandoc
      - name: the checkout is still as the tag left it
        run: |
          left="$(git status --porcelain)"
          if [ -n "$left" ]; then
            echo "make check, or the recording, left these behind, and Go would stamp the release as built from changed sources:" >&2
            echo "$left" >&2
            exit 1
          fi
      - name: build
        env:
          PKG: ${{ inputs.package }}
          PAGE: ${{ inputs.page }}
          MAN: ${{ inputs.man }}
          MEDIA_TARGET: ${{ inputs.media }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -u
          # The same files give the same archive, byte for byte: fixed order, dates and owner.
          pack() {
            tar --sort=name --mtime='1980-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner -C "$1" -cf - . | gzip -n -9 > "$2"
          }
          build_into() {
            local out="$1" target os arch stage size f sum rest
            mkdir -p "$out"
            for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
              os=${target%/*}; arch=${target#*/}; stage="$(mktemp -d)"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$stage/$NAME" "$PKG"
              cp LICENSE "$stage/"
              if [ -f NOTICES ]; then cp NOTICES "$stage/"; fi
              # The manual page as it was written, for the launcher's `man` to open after an install.
              if [ -n "$MAN" ]; then cp "$MAN" "$stage/"; fi
              # mktemp makes a folder only its owner may enter, and tar would write that down.
              chmod 755 "$stage"
              pack "$stage" "$out/${NAME}_${os}_${arch}.tar.gz"
            done
            if [ "$PAGE" = true ]; then
              stage="$(mktemp -d)"
              GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$stage/$NAME.wasm" "$PKG"
              gzip -n -9 -c "$stage/$NAME.wasm" > "$out/$NAME.wasm.gz"
              # The glue must come from the Go that built the program, or the page cannot start it.
              cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "$out/"
              size=$(wc -c < "$out/$NAME.wasm.gz" | tr -d ' ')
              if [ "$size" -gt 20000000 ]; then
                echo "the build for the page is $size bytes gzipped: over 20 MB" >&2
                return 1
              fi
            fi
            if [ -n "$MAN" ]; then mandoc -T html "$MAN" > "$out/$(basename "$MAN").html"; fi
            if [ -n "$MEDIA_TARGET" ]; then cp "$RUNNER_TEMP/media/$NAME.gif" "$RUNNER_TEMP/media/$NAME.png" "$out/"; fi
            # The manifest: every file in name order, with its size and hash. An archive also
            # says what it runs on. It holds no date, so the same build writes the same manifest.
            # It is written beside the folder and moved in, or it would list itself, half made.
            ( cd "$out"
              for f in $(ls | LC_ALL=C sort); do
                size=$(wc -c < "$f" | tr -d ' '); sum=$(sha256sum "$f" | cut -d' ' -f1)
                os=""; arch=""
                case "$f" in "${NAME}"_*_*.tar.gz) rest=${f#"${NAME}"_}; rest=${rest%.tar.gz}; os=${rest%_*}; arch=${rest#*_} ;; esac
                jq -n --arg name "$f" --argjson size "$size" --arg sha256 "$sum" --arg os "$os" --arg arch "$arch" \
                  '{name: $name, size: $size, sha256: $sha256} + (if $os != "" then {os: $os, arch: $arch} else {} end)'
              done | jq -s --arg name "$NAME" --arg version "$VERSION" '{schema: 1, name: $name, version: $version, files: .}' ) > "$out.manifest"
            mv "$out.manifest" "$out/manifest.json"
          }
          # Nothing is written inside the checkout. A file left there makes Go stamp every later
          # build as made from changed sources, so the first archive would differ from the rest.
          build_into "$RUNNER_TEMP/release"
          cat "$RUNNER_TEMP/release/manifest.json"
          if jq -e 'any(.files[]; .name == "manifest.json" or .size == 0)' "$RUNNER_TEMP/release/manifest.json" > /dev/null; then
            echo "the manifest lists itself, or an empty file" >&2
            exit 1
          fi
          if [ "$REHEARSAL" = true ]; then
            build_into "$RUNNER_TEMP/twice"
            cmp "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/twice/manifest.json" || { echo "built twice, the release differs" >&2; exit 1; }
            echo "built twice, the release is the same"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  # A program whose source is private is published from a public repository beside it, where a
  # person approves before the release key signs: a private repository here has no environment
  # to ask one. This hands the unsigned release over as a draft, on a tag of the same name, and
  # starts that repository's release workflow. The one job that holds the token.
  hand-over:
    if: ${{ inputs.to != '' && !inputs.rehearsal }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: hand the release over
        env:
          GH_TOKEN: ${{ secrets.HANDOVER_TOKEN }}
          TO: ${{ inputs.to }}
        run: |
          set -u
          if [ -z "$GH_TOKEN" ]; then echo "no HANDOVER_TOKEN: a caller that names to must pass it, see RELEASES.md" >&2; exit 1; fi
          # A version is handed over once. Its draft and its tag there can be deleted, since nothing is signed yet.
          if gh api "repos/$TO/git/ref/tags/$VERSION" > /dev/null 2>&1; then
            echo "$TO already has a tag $VERSION: to hand it over again, delete its draft release and the tag there" >&2
            exit 1
          fi
          main=$(gh api "repos/$TO/commits/main" --jq .sha)
          gh api -X POST "repos/$TO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$main" > /dev/null
          gh release create "$VERSION" dist/* --repo "$TO" --draft --verify-tag --title "$NAME $VERSION" \
            --notes "Handed over by $GITHUB_REPOSITORY, run $GITHUB_RUN_ID, and not signed yet."
          gh workflow run release.yml --repo "$TO" --ref "$VERSION"
          echo "handed over: approve it in $TO's release run, https://github.com/$TO/actions"
